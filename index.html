<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Un campo de girasoles 🌻</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{background:linear-gradient(#8fd8ff 0%,#dff6ff 58%,#83c95b 58%,#4e9c45 100%);position:relative}
.sun{position:absolute;right:8vw;top:7vh;width:90px;height:90px;border-radius:50%;background:#ffd94a;box-shadow:0 0 50px #fff0a0;opacity:.9}
.content{position:relative;z-index:3;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{background:rgba(255,255,255,.78);backdrop-filter:blur(10px);padding:34px 28px;border-radius:28px;box-shadow:0 15px 50px rgba(36,75,30,.2);max-width:520px}
h1{margin:0 0 10px;font-size:clamp(30px,7vw,54px);color:#405b2c}.sub{margin:0 0 25px;color:#53664b;font-size:17px}
button{border:0;border-radius:999px;padding:16px 28px;font-size:18px;font-weight:800;background:#f5bd16;color:#553800;cursor:pointer;box-shadow:0 8px 20px rgba(125,83,0,.25);transition:.2s}button:hover{transform:translateY(-2px) scale(1.02)}
.field{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.flower{position:absolute;width:72px;height:110px;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) forwards, sway 3s ease-in-out infinite 1s;filter:drop-shadow(0 5px 3px rgba(50,70,20,.2))}
.stem{position:absolute;width:7px;height:75px;background:#39843a;left:33px;top:35px;border-radius:8px}.leaf{position:absolute;width:28px;height:15px;background:#4d9e3f;border-radius:100% 0 100% 0;top:70px}.leaf.l{left:9px;transform:rotate(20deg)}.leaf.r{left:35px;top:58px;transform:scaleX(-1) rotate(20deg)}
.head{position:absolute;left:7px;top:0;width:58px;height:58px;border-radius:50%;background:#4a2b0d}.petal{position:absolute;left:18px;top:1px;width:22px;height:32px;border-radius:50%;background:#f8c51d;transform-origin:11px 28px}
@keyframes grow{from{transform:scale(.05) translateY(40px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}@keyframes sway{0%,100%{rotate:-2deg}50%{rotate:3deg}}
.message{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;background:rgba(55,74,37,.82);color:white;padding:10px 17px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .4s}.message.show{opacity:1}
</style></head>
<body><div class="sun"></div><div class="field" id="field"></div>
<div class="content"><div class="card"><h1>🌻 Para ti</h1><p class="sub">Presiona el botón y deja que aparezca un campo entero de girasoles.</p><button id="btn">Llenar de girasoles 🌻</button></div></div><div class="message" id="msg">Ahora sí… un mar de girasoles 🌻</div>
<script>
const field=document.getElementById('field'),btn=document.getElementById('btn'),msg=document.getElementById('msg');
function flower(x,y,s,delay){const f=document.createElement('div');f.className='flower';f.style.left=x+'px';f.style.top=y+'px';f.style.transform=`scale(${s})`;f.style.animationDelay=`${delay}s,${delay+1}s`;f.innerHTML='<div class="stem"></div><div class="leaf l"></div><div class="leaf r"></div><div class="head"></div>';const head=f.querySelector('.head');for(let i=0;i<12;i++){const p=document.createElement('i');p.className='petal';p.style.transform=`rotate(${i*30}deg)`;head.appendChild(p)}field.appendChild(f)}
function fill(){field.innerHTML='';const w=innerWidth,h=innerHeight;const count=Math.min(115,Math.floor(w*h/9000));for(let i=0;i<count;i++){const x=Math.random()*(w-70);const y=h*.18+Math.random()*(h*.78);const s=.55+Math.random()*.75;flower(x,y,s,Math.random()*1.4)}msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),3500);btn.textContent='¡Más girasoles! 🌻';}
btn.addEventListener('click',fill);window.addEventListener('resize',()=>{if(field.children.length)fill()});
</script></body></html>
